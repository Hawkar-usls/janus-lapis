name: JANUS Beetle producer bounded recovery

on:
  schedule:
    # Secondary opportunities: skips are still possible on GitHub-hosted cron.
    - cron: '13,43 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - tools/beetle_producer_recovery.py
      - tests/test_beetle_producer_recovery.py
      - .github/workflows/beetle-producer-bounded-recovery.yml
  push:
    branches: [main]
    paths:
      - tools/beetle_producer_recovery.py
      - tests/test_beetle_producer_recovery.py
      - .github/workflows/beetle-producer-bounded-recovery.yml

permissions:
  contents: read

concurrency:
  group: janus-beetle-producer-bounded-recovery
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test wake policy and no Rowan authority
        run: |
          python -m py_compile tools/beetle_producer_recovery.py tests/test_beetle_producer_recovery.py
          python -m unittest tests.test_beetle_producer_recovery -v

  recover:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Fetch exact existing producer workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/universal-beetle-hourly.yml/runs?per_page=100" > producer-runs.json
      - name: Checkout durable mirrors read-only for independent ACK refresh
        uses: actions/checkout@v5
        with:
          ref: beetle-state
          path: beetle-durable
          persist-credentials: false
      - name: Recalculate live ACK health independently of producer cron
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python - <<'PY'
          import json
          from pathlib import Path
          from beetle_delivery_health import inspect
          root = Path("beetle-durable/data/beetle-state")
          health = inspect(root, stale_minutes=180)
          Path("delivery-health.json").write_text(
              json.dumps(health, sort_keys=True, allow_nan=False) + "\n",
              encoding="utf-8",
          )
          print("BEETLE_RECOVERY_REFRESHED_ACK_HEALTH=" + health["status"])
          print("BEETLE_RECOVERY_REFRESHED_PENDING=" + str(health["total_pending"]))
          PY
      - name: Refuse duplicates and sustained receiver backlog
        id: gate
        run: python tools/beetle_producer_recovery.py --input producer-runs.json --delivery-health delivery-health.json
      - name: Wake only the existing vetted main-branch Beetle workflow
        if: steps.gate.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/universal-beetle-hourly.yml/dispatches" \
            -f ref=main \
            -f 'inputs[mode]=both'
          echo 'BEETLE_PRODUCER_RECOVERY=SAFE_DISPATCH_ISSUED'
