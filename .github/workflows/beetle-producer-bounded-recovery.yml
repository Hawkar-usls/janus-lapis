name: JANUS Beetle producer bounded recovery

on:
  schedule:
    # Secondary opportunities: skips are still possible on GitHub-hosted cron.
    - cron: '13,43 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - tools/beetle_producer_recovery.py
      - tests/test_beetle_producer_recovery.py
      - .github/workflows/beetle-producer-bounded-recovery.yml
  push:
    branches: [main]
    paths:
      - tools/beetle_producer_recovery.py
      - tests/test_beetle_producer_recovery.py
      - .github/workflows/beetle-producer-bounded-recovery.yml

permissions:
  contents: read

concurrency:
  group: janus-beetle-producer-bounded-recovery
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test wake policy and no Rowan authority
        run: |
          python -m py_compile tools/beetle_producer_recovery.py tests/test_beetle_producer_recovery.py
          python -m unittest tests.test_beetle_producer_recovery -v

  recover:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Fetch exact existing producer workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/universal-beetle-hourly.yml/runs?per_page=100" > producer-runs.json
      - name: Read durable receiver delivery health from beetle-state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method GET "repos/$GITHUB_REPOSITORY/contents/data/beetle-state/latest_delivery_health.json?ref=beetle-state" --jq '.content' | base64 -d > delivery-health.json
      - name: Refuse duplicates and sustained receiver backlog
        id: gate
        run: python tools/beetle_producer_recovery.py --input producer-runs.json --delivery-health delivery-health.json
      - name: Wake only the existing vetted main-branch Beetle workflow
        if: steps.gate.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/universal-beetle-hourly.yml/dispatches" \
            -f ref=main \
            -f 'inputs[mode]=both'
          echo 'BEETLE_PRODUCER_RECOVERY=SAFE_DISPATCH_ISSUED'
