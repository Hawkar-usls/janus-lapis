name: JANUS Reverse-Gate Meta271 Lattice

on:
  pull_request:
    branches: [main]
  push:
    branches: [research/reverse-gate-v020]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  meta271-sensory-lattice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout JANUS-LAPIS
        uses: actions/checkout@v4

      - name: Checkout JANUS Meta Registry
        uses: actions/checkout@v4
        with:
          repository: Hawkar-usls/janus-meta-registry
          path: meta_registry

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install codec dependency
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3'

      - name: Ouroboros lattice self-test
        run: python reverse_gate/run_multiconversion_gate.py --selftest --outdir reverse_gate_runs/lattice_selftest

      - name: Run remaining Meta271 holdout through sensory lattice
        run: |
          python reverse_gate/run_multiconversion_gate.py \
            --meta-root meta_registry \
            --config config/JANUS_113_8.json \
            --seed 1138 \
            --holdout-start 100 \
            --outdir reverse_gate_runs/meta271_lattice

      - name: Publish lattice summary
        if: always()
        run: |
          if [ -f reverse_gate_runs/meta271_lattice/REPORT.md ]; then
            cat reverse_gate_runs/meta271_lattice/REPORT.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Meta271 lattice evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JANUS_REVERSE_GATE_META271_LATTICE
          path: reverse_gate_runs/
          retention-days: 30
