name: JANUS Beetle → Genesis durable delivery watchdog

on:
  # Independent scheduled observations are required to prove schedule liveness.
  # GitHub may skip individual ticks; three off-hour opportunities reduce risk
  # without ever counting workflow_run/push as a scheduled success.
  schedule:
    - cron: '17,37,57 * * * *'
  workflow_dispatch:
  # GitHub may defer or omit cron ticks. A successful producer or receiver
  # gives the observer a second wake-up path without cross-repository tokens.
  workflow_run:
    workflows:
      - 'JANUS Universal Beetle hourly'
      - 'JANUS Beetle Memory Receiver'
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'tools/beetle_home_watchdog.py'
      - 'tests/test_beetle_home_watchdog.py'
      - 'tools/beetle_incident_issues.py'
      - 'tests/test_beetle_incident_issues.py'
      - 'tools/beetle_observation_blindness.py'
      - 'tests/test_beetle_observation_blindness.py'
      - 'tools/beetle_watchdog_receipt.py'
      - 'tests/test_beetle_watchdog_receipt.py'
      - 'tools/beetle_home_highwater.py'
      - 'tests/test_beetle_home_highwater.py'
      - '.github/workflows/janus-beetle-home-watchdog.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/beetle_home_watchdog.py'
      - 'tests/test_beetle_home_watchdog.py'
      - 'tools/beetle_incident_issues.py'
      - 'tests/test_beetle_incident_issues.py'
      - 'tools/beetle_observation_blindness.py'
      - 'tests/test_beetle_observation_blindness.py'
      - 'tools/beetle_watchdog_receipt.py'
      - 'tests/test_beetle_watchdog_receipt.py'
      - 'tools/beetle_home_highwater.py'
      - 'tests/test_beetle_home_highwater.py'
      - '.github/workflows/janus-beetle-home-watchdog.yml'

permissions:
  contents: read

concurrency:
  group: janus-beetle-home-watchdog
  cancel-in-progress: false

jobs:
  observe:
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      status: ${{ steps.classify.outputs.status }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify normal and adversarial SLO scenarios
        run: python -m unittest -v tests.test_beetle_home_watchdog tests.test_beetle_incident_issues tests.test_beetle_observation_blindness tests.test_beetle_watchdog_receipt tests.test_beetle_home_highwater
      - name: Check real durable ACK and Cloud HOME without writes
        shell: bash
        # A real deployment SLO ALERT is operational evidence, not a code
        # regression in an unrelated PR. Preserve the classified artifact,
        # but only trusted main runs fail and open the incident journal.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          python tools/beetle_home_watchdog.py | tee watchdog-run.txt "$GITHUB_STEP_SUMMARY"
      - name: Classify receipt, keeping missing or malformed telemetry UNKNOWN
        id: classify
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status="$(python tools/beetle_watchdog_receipt.py --report watchdog-run.txt)"
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Preserve watcher receipt, even after ALERT
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: janus-watchdog-${{ steps.classify.outputs.status }}-${{ github.run_id }}
          path: watchdog-run.txt
          if-no-files-found: warn
          retention-days: 14

  incident-ledger:
    # Only trusted main-branch runs can modify Issues. The observer itself has
    # no write credentials, and a PR cannot open/close public incidents.
    if: >-
      ${{ always() && github.ref == 'refs/heads/main' &&
          github.event_name != 'pull_request' && needs.observe.result != 'skipped' }}
    needs: observe
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: janus-watchdog-${{ needs.observe.outputs.status }}-${{ github.run_id }}
      - name: Upsert one deduplicated durable issue on state transition
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/beetle_incident_issues.py --report watchdog-run.txt
      - name: Monotonically advance independent Genesis HOME high-water witness
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/beetle_home_highwater.py --report watchdog-run.txt
      - name: Escalate only sustained UNKNOWN observation blindness
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/beetle_observation_blindness.py --report watchdog-run.txt
