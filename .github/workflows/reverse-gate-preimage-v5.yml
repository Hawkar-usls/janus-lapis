name: JANUS Reverse-Gate Scalar Hippocampus v5

on:
  pull_request:
    branches: [main]
  push:
    branches: [research/reverse-gate-v020]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scalar-hippocampus-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout JANUS-LAPIS
        uses: actions/checkout@v4
      - name: Checkout JANUS Meta Registry
        uses: actions/checkout@v4
        with:
          repository: Hawkar-usls/janus-meta-registry
          path: meta_registry
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ouroboros memory self-test
        run: python reverse_gate/janus_preimage_reconstruction_v5.py --selftest --outdir reverse_gate_runs/preimage_v5_selftest
      - name: Run cross-file scalar Hippocampus
        run: |
          python reverse_gate/janus_preimage_reconstruction_v5.py \
            --meta-root meta_registry \
            --budget 180000 \
            --outdir reverse_gate_runs/preimage_v5_real
      - name: Publish result
        if: always()
        run: |
          if [ -f reverse_gate_runs/preimage_v5_real/REPORT.md ]; then
            cat reverse_gate_runs/preimage_v5_real/REPORT.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JANUS_PREIMAGE_V5_REAL
          path: reverse_gate_runs/
          retention-days: 30
