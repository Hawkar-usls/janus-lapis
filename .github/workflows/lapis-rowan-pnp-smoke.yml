name: JANUS Lapis x Rowan x PNP Read-only Smoke
on:
  pull_request:
    paths:
      - "tools/lapis_rowan_pnp_bridge_smoke.py"
      - "tests/test_lapis_rowan_pnp_bridge_smoke.py"
      - ".github/workflows/lapis-rowan-pnp-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-source-integrity-and-converter:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run offline unit tests and negative controls
        run: python -m unittest -v tests/test_lapis_rowan_pnp_bridge_smoke.py tests/test_lapis_converter.py
      - name: Consume exact pinned Meta Registry 5D and archived Rowan BBC1 state
        run: |
          python tools/lapis_rowan_pnp_bridge_smoke.py \
            --pinned-source-smoke \
            --output "/tmp/lapis-rowan-pnp-smoke.json"
      - name: Preserve zero-credit factual test receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lapis-rowan-pnp-readonly-smoke
          path: /tmp/lapis-rowan-pnp-smoke.json
          if-no-files-found: warn
          retention-days: 21
