name: TOPA PD1 audit existing acquired GEO artifact

on:
  push:
    branches: [LONGEVITY-SURVIVOR]
    paths:
      - .github/workflows/topa-pd1-reconcile-existing-artifact.yml
      - longevity-survivor/tools/audit_pd1_geo_acquired_manifest.py
      - longevity-survivor/tools/probe_wu_tac_counts.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout audit script
        uses: actions/checkout@v4
      - name: Download ONLY existing successful source-byte artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prior
          gh run download 39026401715 --repo "${{ github.repository }}" --name topa-pd1-geo-zenodo-verified-public-bytes --dir prior
          find prior -maxdepth 2 -name manifest.json -print
      - name: Audit exact local files with SHA256 and GSM coverage
        shell: bash
        run: |
          TOPA_PRIOR_DIR=prior TOPA_AUDIT_OUT=topa_pd1_manifest_audit python longevity-survivor/tools/audit_pd1_geo_acquired_manifest.py 2>&1 | tee pd1_audit.log
      - name: Upload small audit receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topa-pd1-gsm-provenance-audit
          path: |
            topa_pd1_manifest_audit/*.json
            pd1_audit.log
          if-no-files-found: error
          retention-days: 14

      - name: Replay descriptive gene profiles from original 10x matrices
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check scipy
          (cd prior && TOPA_OUTPUT=topa_pd1_acquisition TOPA_AUDIT_OUTPUT=../topa_pd1_expression python ../longevity-survivor/tools/audit_pd1_mi_tac_manifest.py) 2>&1 | tee topa_pd1_expression.log
      - name: Publish compact independent MI expression audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topa-pd1-mi-10x-cxcl9-cxcr3-exploratory
          path: |
            topa_pd1_expression/
            topa_pd1_expression.log
          if-no-files-found: warn
          retention-days: 14

      - name: Probe Wu TAC processed counts from official GEO locations
        shell: bash
        run: |
          WU_PROBE_OUT=topa_wu_processed_probe python longevity-survivor/tools/probe_wu_tac_counts.py 2>&1 | tee topa_wu_probe.log
      - name: Publish Wu public data locator report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topa-wu-tac-official-processed-counts-probe
          path: |
            topa_wu_processed_probe/
            topa_wu_probe.log
          if-no-files-found: warn
          retention-days: 14
