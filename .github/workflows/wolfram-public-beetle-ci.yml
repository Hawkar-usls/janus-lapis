name: JANUS Beetle / Wolfram public metadata safety

on:
  pull_request:
    paths:
      - "tools/wolfram_public_sources.py"
      - "tools/universal_beetle.py"
      - "data/beetle/directions.json"
      - "tests/test_beetle_wolfram_public.py"
      - "tests/test_beetle_wolfram_mcp.py"
      - "tools/wolfram_mcp_one_shot.py"
      - ".github/workflows/wolfram-public-beetle-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install --disable-pip-version-check requests
      - name: Verify license allowlist, short metadata, no Alpha API or login
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_beetle_wolfram_public.py' -v
          python -m unittest discover -s tests -p 'test_beetle_wolfram_mcp.py' -v
          python -m unittest discover -s tests -p 'test_beetle_rowan_focus.py' -v
          python -m unittest discover -s tests -p 'test_beetle_rowan_relevance.py' -v
      - name: Verify direction budget and isolated source kinds
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('data/beetle/directions.json').read_text())
          d=[x for x in cfg['directions'] if x['id']=='wolfram_official_open_quantum']
          assert len(d)==1 and d[0]['priority']==91
          assert {s['kind'] for s in d[0]['sources']} == {'wolfram_public_feed','wolfram_public_repo','wolfram_mcp_once'}
          assert len(d[0]['sources'])==3
          assert all(s.get('max_results',1) <= 3 for s in d[0]['sources'])
          assert d[0]['scientific_boundary']['wolfram_alpha_queries_without_appid'] is False
          print("Wolfram official public sources: metadata only / no AppID / two bounded endpoints")
          PY
