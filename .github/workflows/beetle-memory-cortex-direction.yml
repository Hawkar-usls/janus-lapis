name: Beetle Memory Cortex scheduling contract
on:
  pull_request:
    paths:
      - 'data/beetle/directions.json'
      - 'tests/test_beetle_memory_cortex_direction.py'
      - '.github/workflows/beetle-memory-cortex-direction.yml'
  push:
    branches: [main]
    paths:
      - 'data/beetle/directions.json'
      - 'tests/test_beetle_memory_cortex_direction.py'
permissions:
  contents: read
jobs:
  actual-scheduling:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - run: python -m unittest discover -s tests -p 'test_beetle_memory_cortex_direction.py' -v
