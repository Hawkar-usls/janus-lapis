name: JANUS Universal Beetle hourly

on:
  schedule:
    - cron: "7,27,47 * * * *"
  push:
    branches: [main]
    paths:
      - "tools/universal_beetle.py"
      - "tools/beetle_director_overlay.py"
      - "tools/beetle_context_projector.py"
      - "tools/beetle_mirror_router.py"
      - "data/beetle/directions.json"
      - ".github/workflows/universal-beetle-hourly.yml"
      - "requirements-ocean-beetle.txt"
  workflow_dispatch:
    inputs:
      mode:
        description: scout, graze, or both
        required: true
        default: both
        type: choice
        options: [both, scout, graze]
      direction:
        description: Optional effective lane id
        required: false
        default: ""
      grazer_task:
        description: Optional grazer task id
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: janus-universal-beetle-state
  cancel-in-progress: false

jobs:
  beetle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          path: lapis

      - name: Checkout durable Beetle memory
        uses: actions/checkout@v4
        with:
          ref: beetle-state
          path: beetle-memory
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Beetle dependencies
        working-directory: lapis
        run: python -m pip install -r requirements-ocean-beetle.txt

      - name: Ask Demiurge for current attention and build mirrored schedule
        run: |
          mkdir -p lapis/runtime beetle-memory/data/beetle-state
          python lapis/tools/beetle_director_overlay.py \
            --base lapis/data/beetle/directions.json \
            --static-url https://raw.githubusercontent.com/Hawkar-usls/Janus-Demiurge/main/beetle/DEMIURGE_BEETLE_DIRECTIVES.json \
            --live-url https://raw.githubusercontent.com/Hawkar-usls/Janus-Demiurge/main/beetle/LIVE_PRIORITIES.json \
            --state-dir beetle-memory/data/beetle-state \
            --max-primary 10 \
            --max-lanes 16 \
            --out lapis/runtime/effective_directions.json

      - name: Apply bounded WORKER profile
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('lapis/runtime/effective_directions.json')
          cfg = json.loads(path.read_text(encoding='utf-8'))

          required_principles = {
              'DISCOVERY_CANDIDATE_NOT_TRUTH',
              'PROVENANCE_BEFORE_INTERPRETATION',
              'DEDUPE_BEFORE_STORAGE',
              'CHECKPOINT_BEFORE_NEXT',
              'NO_FULL_DOWNLOAD_WITHOUT_EXPLICIT_TASK_APPROVAL',
              'FORWARD_REQUIRES_REVERSE_COUNTEREVIDENCE_AND_CONTROL_MIRRORS',
              'PRIORITY_IS_ATTENTION_NOT_EVIDENCE',
              'ROUTING_TO_REPO_MEMORY_IS_NOT_PROMOTION',
          }
          missing = sorted(required_principles - set(cfg.get('principles', [])))
          if missing:
              raise SystemExit(f'WORKER profile refused: missing guardrails: {missing}')

          lenses = set(cfg.get('default_mirror_lenses', []))
          required_lenses = {'FORWARD', 'REVERSE', 'COUNTEREVIDENCE', 'CONTROL'}
          if not required_lenses.issubset(lenses):
              raise SystemExit('WORKER profile refused: four-lens mirror invariant missing')

          budget = cfg.setdefault('global_budget', {})
          budget.update({
              'max_requests_per_run': 72,
              'max_new_candidates_per_run': 160,
              'max_metadata_bytes_per_run': 15_000_000,
          })

          for task in cfg.get('grazer_tasks', []):
              if not task.get('enabled', True):
                  continue
              task['max_bites_per_run'] = max(4, int(task.get('max_bites_per_run', 1)))
              task['timeout_seconds'] = max(1200, int(task.get('timeout_seconds', 900)))

          cfg['worker_profile'] = {
              'schema': 'janus.universal_beetle.worker_profile.v1',
              'mode': 'WORKER',
              'cadence_minutes': 20,
              'max_primary_directions': 10,
              'max_mirror_lanes': 16,
              'max_requests_per_run': 72,
              'max_new_candidates_per_run': 160,
              'max_metadata_bytes_per_run': 15_000_000,
              'min_grazer_bites_per_run': 4,
              'guardrail_policy': 'UNCHANGED_FAIL_CLOSED',
              'epistemic_authority_delta': 0,
          }
          path.write_text(json.dumps(cfg, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(cfg['worker_profile'], ensure_ascii=False, sort_keys=True))
          PY

      - name: Run Universal Beetle
        env:
          GH_TOKEN_FOR_BEETLE: ${{ github.token }}
          MODE: ${{ github.event.inputs.mode || 'both' }}
          DIRECTION: ${{ github.event.inputs.direction || '' }}
          GRAZER_TASK: ${{ github.event.inputs.grazer_task || '' }}
        shell: bash
        run: |
          set -euo pipefail
          export GITHUB_TOKEN="$GH_TOKEN_FOR_BEETLE"
          args=(
            --repo-root "$GITHUB_WORKSPACE/lapis"
            --config runtime/effective_directions.json
            --state-dir "$GITHUB_WORKSPACE/beetle-memory/data/beetle-state"
            --mode "$MODE"
          )
          if [[ -n "$DIRECTION" ]]; then args+=(--direction "$DIRECTION"); fi
          if [[ -n "$GRAZER_TASK" ]]; then args+=(--grazer-task "$GRAZER_TASK"); fi
          python lapis/tools/universal_beetle.py "${args[@]}" | tee beetle-memory/data/beetle-state/last_console.json

      - name: Project source identities through every active mirror lens
        if: always()
        run: |
          python lapis/tools/beetle_context_projector.py \
            --state-dir beetle-memory/data/beetle-state \
            --effective-config lapis/runtime/effective_directions.json \
            | tee beetle-memory/data/beetle-state/last_context_console.json

      - name: Route new mirror contexts into provenance-bound repo mirrors
        if: always()
        run: |
          python lapis/tools/beetle_mirror_router.py \
            --state-dir beetle-memory/data/beetle-state \
            --effective-config lapis/runtime/effective_directions.json \
            | tee beetle-memory/data/beetle-state/last_routing_console.json

      - name: Commit durable state and mirror outboxes
        working-directory: beetle-memory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "janus-beetle[bot]"
          git config user.email "janus-beetle[bot]@users.noreply.github.com"
          git add data/beetle-state
          if git diff --cached --quiet; then
            echo "No state change"
            exit 0
          fi
          git commit -m "beetle: mirrored hourly research state ${GITHUB_RUN_ID}"
          git pull --rebase origin beetle-state
          git push origin HEAD:beetle-state

      - name: Upload compact run receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universal-beetle-${{ github.run_id }}
          path: |
            lapis/runtime/effective_directions.json
            beetle-memory/data/beetle-state/latest_run.json
            beetle-memory/data/beetle-state/latest_context_projection.json
            beetle-memory/data/beetle-state/latest_routing.json
            beetle-memory/data/beetle-state/last_console.json
            beetle-memory/data/beetle-state/last_context_console.json
            beetle-memory/data/beetle-state/last_routing_console.json
          if-no-files-found: warn
          retention-days: 14
