name: JANUS Universal Beetle hourly

on:
  schedule:
    - cron: "7,27,47 * * * *"
  push:
    branches: [main]
    paths:
      - "tools/universal_beetle.py"
      - "tools/beetle_shard_store.py"
      - "tools/beetle_director_overlay.py"
      - "tools/beetle_context_projector.py"
      - "tools/beetle_mirror_router.py"
      - "tools/beetle_memory_receiver.py"
      - "tools/beetle_partial_checkpoint.py"
      - "tools/beetle_delivery_health.py"
      - "data/beetle/directions.json"
      - ".github/workflows/universal-beetle-hourly.yml"
      - "requirements-ocean-beetle.txt"
      - "tests/test_beetle_shard_store.py"
      - "tests/test_beetle_delivery.py"
      - "tests/test_beetle_partial_checkpoint.py"
  workflow_dispatch:
    inputs:
      mode:
        description: scout, graze, or both
        required: true
        default: both
        type: choice
        options: [both, scout, graze]
      direction:
        description: Optional effective lane id
        required: false
        default: ""
      grazer_task:
        description: Optional grazer task id
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: janus-universal-beetle-state
  cancel-in-progress: false

jobs:
  beetle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          path: lapis

      - name: Checkout durable Beetle memory
        uses: actions/checkout@v4
        with:
          ref: beetle-state
          path: beetle-memory
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Beetle dependencies
        working-directory: lapis
        run: python -m pip install -r requirements-ocean-beetle.txt

      - name: Verify SPOILER storage and Genesis inbox contracts
        working-directory: lapis
        run: |
          python -m unittest discover -s tests -p 'test_beetle_shard_store.py' -v
          python -m unittest discover -s tests -p 'test_beetle_delivery.py' -v
          python -m unittest discover -s tests -p 'test_beetle_partial_checkpoint.py' -v

      - name: Ask Demiurge for current attention and build mirrored schedule
        run: |
          mkdir -p lapis/runtime beetle-memory/data/beetle-state
          python lapis/tools/beetle_director_overlay.py \
            --base lapis/data/beetle/directions.json \
            --static-url https://raw.githubusercontent.com/Hawkar-usls/Janus-Demiurge/main/beetle/DEMIURGE_BEETLE_DIRECTIVES.json \
            --live-url https://raw.githubusercontent.com/Hawkar-usls/Janus-Demiurge/main/beetle/LIVE_PRIORITIES.json \
            --state-dir beetle-memory/data/beetle-state \
            --max-primary 10 \
            --max-lanes 16 \
            --out lapis/runtime/effective_directions.json

      - name: Apply bounded WORKER profile
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('lapis/runtime/effective_directions.json')
          cfg = json.loads(path.read_text(encoding='utf-8'))

          required_principles = {
              'DISCOVERY_CANDIDATE_NOT_TRUTH',
              'PROVENANCE_BEFORE_INTERPRETATION',
              'DEDUPE_BEFORE_STORAGE',
              'CHECKPOINT_BEFORE_NEXT',
              'NO_FULL_DOWNLOAD_WITHOUT_EXPLICIT_TASK_APPROVAL',
              'FORWARD_REQUIRES_REVERSE_COUNTEREVIDENCE_AND_CONTROL_MIRRORS',
              'PRIORITY_IS_ATTENTION_NOT_EVIDENCE',
              'ROUTING_TO_REPO_MEMORY_IS_NOT_PROMOTION',
          }
          missing = sorted(required_principles - set(cfg.get('principles', [])))
          if missing:
              raise SystemExit(f'WORKER profile refused: missing guardrails: {missing}')

          lenses = set(cfg.get('default_mirror_lenses', []))
          required_lenses = {'FORWARD', 'REVERSE', 'COUNTEREVIDENCE', 'CONTROL'}
          if not required_lenses.issubset(lenses):
              raise SystemExit('WORKER profile refused: four-lens mirror invariant missing')

          active_lanes = cfg.get('directions', [])
          actual_lenses = {lane.get('mirror_lens') for lane in active_lanes}
          if not active_lanes or len(active_lanes) > 16 or actual_lenses != required_lenses:
            raise SystemExit('WORKER profile refused: actual scheduled lanes violate four-lens budget')
          if cfg.get('effective_meta', {}).get('all_four_mirror_lenses_present') is not True:
            raise SystemExit('WORKER profile refused: director did not attest actual four-lens coverage')

          budget = cfg.setdefault('global_budget', {})
          budget.update({
              'max_requests_per_run': 72,
              'max_new_candidates_per_run': 160,
              'max_metadata_bytes_per_run': 15_000_000,
          })

          for task in cfg.get('grazer_tasks', []):
              if not task.get('enabled', True):
                  continue
              task['max_bites_per_run'] = max(4, int(task.get('max_bites_per_run', 1)))
              task['timeout_seconds'] = max(1200, int(task.get('timeout_seconds', 900)))

          cfg['worker_profile'] = {
              'schema': 'janus.universal_beetle.worker_profile.v1',
              'mode': 'WORKER',
            'janus_role': 'SPOILER_BACKGROUND_COLLECTOR',
              'cadence_minutes': 20,
              'max_primary_directions': 10,
              'max_mirror_lanes': 16,
              'max_requests_per_run': 72,
              'max_new_candidates_per_run': 160,
              'max_metadata_bytes_per_run': 15_000_000,
              'min_grazer_bites_per_run': 4,
              'guardrail_policy': 'UNCHANGED_FAIL_CLOSED',
              'epistemic_authority_delta': 0,
            'external_effect_authority_delta': 0,
          }
          path.write_text(json.dumps(cfg, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(cfg['worker_profile'], ensure_ascii=False, sort_keys=True))
          PY

      - name: Recover and migrate durable Beetle ledgers without data loss
        run: |
          set -euo pipefail
          python lapis/tools/beetle_shard_store.py migrate \
            --state-dir beetle-memory/data/beetle-state

      - name: Snapshot previous validated state before worker mutations
        run: |
          python lapis/tools/beetle_partial_checkpoint.py snapshot \
            --state-dir beetle-memory/data/beetle-state \
            --baseline lapis/runtime/beetle_partial_baseline.json

      - name: Run Universal Beetle
        id: worker
        continue-on-error: true
        env:
          GH_TOKEN_FOR_BEETLE: ${{ github.token }}
          MODE: ${{ github.event.inputs.mode || 'both' }}
          DIRECTION: ${{ github.event.inputs.direction || '' }}
          GRAZER_TASK: ${{ github.event.inputs.grazer_task || '' }}
        shell: bash
        run: |
          set -euo pipefail
          export GITHUB_TOKEN="$GH_TOKEN_FOR_BEETLE"
          args=(
            --repo-root "$GITHUB_WORKSPACE/lapis"
            --config runtime/effective_directions.json
            --state-dir "$GITHUB_WORKSPACE/beetle-memory/data/beetle-state"
            --durable-state-git-root "$GITHUB_WORKSPACE/beetle-memory"
            --checkpoint-baseline "$GITHUB_WORKSPACE/lapis/runtime/beetle_partial_baseline.json"
            --mode "$MODE"
          )
          if [[ -n "$DIRECTION" ]]; then args+=(--direction "$DIRECTION"); fi
          if [[ -n "$GRAZER_TASK" ]]; then args+=(--grazer-task "$GRAZER_TASK"); fi
          python lapis/tools/universal_beetle.py "${args[@]}" | tee beetle-memory/data/beetle-state/last_console.json

      - name: Validate interrupted run and salvage only complete records
        if: ${{ steps.worker.outcome == 'failure' }}
        run: |
          set -euo pipefail
          python lapis/tools/beetle_partial_checkpoint.py salvage \
            --state-dir beetle-memory/data/beetle-state \
            --baseline lapis/runtime/beetle_partial_baseline.json \
            --run-id "$GITHUB_RUN_ID"

      - name: Commit independently verified partial records (never queues or ACKs)
        if: ${{ steps.worker.outcome == 'failure' }}
        working-directory: beetle-memory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "janus-beetle[bot]"
          git config user.email "janus-beetle[bot]@users.noreply.github.com"
          git add data/beetle-state/candidates.parts data/beetle-state/receipts.parts
          git add data/beetle-state/seen.json data/beetle-state/cursors.json
          git add data/beetle-state/latest_partial_checkpoint.json data/beetle-state/latest_storage_health.json
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          root = Path('data/beetle-state')
          receipt = json.loads((root / 'latest_partial_checkpoint.json').read_text())
          for path in receipt['validated_chunks']:
              subprocess.run(['git', 'add', '--', str(root / path)], check=True)
          staged = subprocess.run(['git', 'diff', '--cached', '--name-only'],
                                  check=True, capture_output=True, text=True).stdout.splitlines()
          # Never commit a sender queue, inbox ACK or unverified subprocess grazer file.
          if any('/mirrors/' in '/' + path or path.endswith('/ACK.json') for path in staged):
              raise SystemExit('partial checkpoint tried to publish delivery state')
          PY
          if git diff --cached --quiet; then
            echo 'No validated partial state to preserve'
          else
            git diff --cached --check
            git commit -m "beetle: validated interrupted run ${GITHUB_RUN_ID}"
            git pull --rebase origin beetle-state
            git push origin HEAD:beetle-state
          fi

      - name: Report interrupted worker after durable salvage
        if: ${{ steps.worker.outcome == 'failure' }}
        run: |
          echo '::error::Beetle worker interrupted; validated partial state was preserved, normal delivery skipped'
          exit 1

      - name: Project source identities through every active mirror lens
        if: ${{ steps.worker.outcome == 'success' }}
        run: |
          python lapis/tools/beetle_context_projector.py \
            --state-dir beetle-memory/data/beetle-state \
            --effective-config lapis/runtime/effective_directions.json \
            | tee beetle-memory/data/beetle-state/last_context_console.json

      - name: Route new mirror contexts into provenance-bound repo mirrors
        if: ${{ steps.worker.outcome == 'success' }}
        run: |
          python lapis/tools/beetle_mirror_router.py \
            --state-dir beetle-memory/data/beetle-state \
            --effective-config lapis/runtime/effective_directions.json \
            | tee beetle-memory/data/beetle-state/last_routing_console.json

      - name: Observe persisted receiver ACKs and delivery lag
        if: ${{ steps.worker.outcome == 'success' }}
        run: |
          python lapis/tools/beetle_delivery_health.py \
            --state-dir beetle-memory/data/beetle-state \
            --stale-minutes 180 \
            | tee beetle-memory/data/beetle-state/last_delivery_console.json

      - name: Seal shard integrity and enforce GitHub blob limits
        if: ${{ steps.worker.outcome == 'success' }}
        run: |
          set -euo pipefail
          python lapis/tools/beetle_shard_store.py seal \
            --state-dir beetle-memory/data/beetle-state \
            --max-file-bytes 80000000

      - name: Commit durable state and mirror outboxes
        if: ${{ steps.worker.outcome == 'success' }}
        working-directory: beetle-memory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "janus-beetle[bot]"
          git config user.email "janus-beetle[bot]@users.noreply.github.com"
          git add data/beetle-state
          if git diff --cached --quiet; then
            echo "No state change"
            exit 0
          fi
          git commit -m "beetle: mirrored hourly research state ${GITHUB_RUN_ID}"
          git pull --rebase origin beetle-state
          git push origin HEAD:beetle-state

      - name: Upload compact run receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universal-beetle-${{ github.run_id }}
          path: |
            lapis/runtime/effective_directions.json
            beetle-memory/data/beetle-state/latest_run.json
            beetle-memory/data/beetle-state/latest_context_projection.json
            beetle-memory/data/beetle-state/latest_routing.json
            beetle-memory/data/beetle-state/latest_storage_health.json
            beetle-memory/data/beetle-state/latest_delivery_health.json
            beetle-memory/data/beetle-state/last_console.json
            beetle-memory/data/beetle-state/last_context_console.json
            beetle-memory/data/beetle-state/last_routing_console.json
            beetle-memory/data/beetle-state/last_delivery_console.json
            beetle-memory/data/beetle-state/latest_partial_checkpoint.json
          if-no-files-found: warn
          retention-days: 14
