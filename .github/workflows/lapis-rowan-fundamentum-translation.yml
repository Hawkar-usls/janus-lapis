name: Lapis Rowan-Fundamentum offline translation
on:
  pull_request:
    paths:
      - 'tools/rowan_fundamentum_translate.py'
      - 'tests/test_rowan_fundamentum_translate.py'
      - 'docs/ROWAN_FUNDAMENTUM_TYPED_TRANSLATOR.md'
      - '.github/workflows/lapis-rowan-fundamentum-translation.yml'
      - 'tools/lapis_converter.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  translation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline projection tests (no Rowan credentials)
        run: python -m unittest discover -s tests -p 'test_rowan_fundamentum_translate.py' -v
