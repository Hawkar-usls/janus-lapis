name: Pv11 DRA008948 public-byte acquisition

on:
  pull_request:
    branches:
      - LONGEVITY-SURVIVOR
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Acquire exact public bytes and extract manifests
        shell: bash
        run: |
          set +e
          rm -rf dra008948_acquisition
          python longevity-survivor/tools/acquire_dra008948.py 2>&1 | tee acquisition.log
          echo "${PIPESTATUS[0]}" > acquisition_exit_code.txt
          exit 0

      - name: Inspect pinned author-published RSEM TPM matrix
        shell: bash
        run: |
          set +e
          rm -rf pv_authors_tpm_inspection
          python longevity-survivor/tools/inspect_pv_authors_tpm.py 2>&1 | tee tpm_inspection.log
          echo "${PIPESTATUS[0]}" > tpm_inspection_exit_code.txt
          exit 0

      - name: Inspect public PvG to g.t bridge candidates
        shell: bash
        run: |
          set +e
          rm -rf pvg_bridge_inspection
          python longevity-survivor/tools/inspect_pvg_to_gt_bridge.py 2>&1 | tee pvg_bridge_inspection.log
          echo "${PIPESTATUS[0]}" > pvg_bridge_inspection_exit_code.txt
          exit 0

      - name: Inspect pinned author Figure S6B for exact identifier bridge
        shell: bash
        run: |
          set +e
          rm -rf author_s6b_bridge_inspection
          python longevity-survivor/tools/inspect_author_s6b_bridge.py 2>&1 | tee author_s6b_bridge_inspection.log
          echo "${PIPESTATUS[0]}" > author_s6b_bridge_inspection_exit_code.txt
          exit 0

      - name: Inspect official PMC supplement for Pv0.9 to Pv5.2 bridge
        shell: bash
        run: |
          set +e
          rm -rf pv09_pv52_pmc_supplement
          python longevity-survivor/tools/inspect_pv09_pv52_pmc_supplement.py 2>&1 | tee pmc_supplement_inspection.log
          echo "${PIPESTATUS[0]}" > pmc_supplement_inspection_exit_code.txt
          exit 0

      - name: Upload proof-carrying acquisition artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pv11-dra008948-acquisition
          path: |
            dra008948_acquisition/
            pv_authors_tpm_inspection/
            pvg_bridge_inspection/
            author_s6b_bridge_inspection/
            pv09_pv52_pmc_supplement/
            acquisition.log
            acquisition_exit_code.txt
            tpm_inspection.log
            tpm_inspection_exit_code.txt
            pvg_bridge_inspection.log
            pvg_bridge_inspection_exit_code.txt
            author_s6b_bridge_inspection.log
            author_s6b_bridge_inspection_exit_code.txt
            pmc_supplement_inspection.log
            pmc_supplement_inspection_exit_code.txt
          if-no-files-found: error
          retention-days: 7

      - name: Enforce acquisition and inspection execution
        shell: bash
        run: |
          for f in acquisition_exit_code.txt tpm_inspection_exit_code.txt pvg_bridge_inspection_exit_code.txt author_s6b_bridge_inspection_exit_code.txt pmc_supplement_inspection_exit_code.txt; do
            echo "$f=$(cat "$f")"
            test "$(cat "$f")" = "0"
          done
