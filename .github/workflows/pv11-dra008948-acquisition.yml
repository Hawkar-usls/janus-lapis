name: Pv11 DRA008948 public-byte acquisition

on:
  pull_request:
    branches:
      - LONGEVITY-SURVIVOR
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Acquire exact public bytes and extract manifests
        shell: bash
        run: |
          set +e
          rm -rf dra008948_acquisition
          python longevity-survivor/tools/acquire_dra008948.py 2>&1 | tee acquisition.log
          code=${PIPESTATUS[0]}
          echo "$code" > acquisition_exit_code.txt
          exit 0

      - name: Inspect pinned author-published RSEM TPM matrix
        shell: bash
        run: |
          set +e
          rm -rf pv_authors_tpm_inspection
          python longevity-survivor/tools/inspect_pv_authors_tpm.py 2>&1 | tee tpm_inspection.log
          code=${PIPESTATUS[0]}
          echo "$code" > tpm_inspection_exit_code.txt
          exit 0

      - name: Inspect public PvG to g.t bridge candidates
        shell: bash
        run: |
          set +e
          rm -rf pvg_bridge_inspection
          python longevity-survivor/tools/inspect_pvg_to_gt_bridge.py 2>&1 | tee pvg_bridge_inspection.log
          code=${PIPESTATUS[0]}
          echo "$code" > pvg_bridge_inspection_exit_code.txt
          exit 0

      - name: Inspect pinned author Figure S6B for exact identifier bridge
        shell: bash
        run: |
          set +e
          rm -rf author_s6b_bridge_inspection
          python longevity-survivor/tools/inspect_author_s6b_bridge.py 2>&1 | tee author_s6b_bridge_inspection.log
          code=${PIPESTATUS[0]}
          echo "$code" > author_s6b_bridge_inspection_exit_code.txt
          exit 0

      - name: Upload proof-carrying acquisition artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pv11-dra008948-acquisition
          path: |
            dra008948_acquisition/
            pv_authors_tpm_inspection/
            pvg_bridge_inspection/
            author_s6b_bridge_inspection/
            acquisition.log
            acquisition_exit_code.txt
            tpm_inspection.log
            tpm_inspection_exit_code.txt
            pvg_bridge_inspection.log
            pvg_bridge_inspection_exit_code.txt
            author_s6b_bridge_inspection.log
            author_s6b_bridge_inspection_exit_code.txt
          if-no-files-found: error
          retention-days: 7

      - name: Enforce acquisition and inspection execution
        shell: bash
        run: |
          acq="$(cat acquisition_exit_code.txt)"
          tpm="$(cat tpm_inspection_exit_code.txt)"
          bridge="$(cat pvg_bridge_inspection_exit_code.txt)"
          s6b="$(cat author_s6b_bridge_inspection_exit_code.txt)"
          echo "acquisition_exit_code=$acq"
          echo "tpm_inspection_exit_code=$tpm"
          echo "pvg_bridge_inspection_exit_code=$bridge"
          echo "author_s6b_bridge_inspection_exit_code=$s6b"
          test "$acq" = "0"
          test "$tpm" = "0"
          test "$bridge" = "0"
          test "$s6b" = "0"
