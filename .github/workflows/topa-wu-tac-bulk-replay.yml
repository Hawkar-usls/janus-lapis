name: TOPA Wu TAC official count replay
on:
  push:
    branches: [LONGEVITY-SURVIVOR]
    paths:
      - .github/workflows/topa-wu-tac-bulk-replay.yml
      - longevity-survivor/tools/replay_wu_tac_bulk.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dataframe parser
        run: python -m pip install --disable-pip-version-check pandas
      - name: Download and inspect bounded official TAC bulk tables
        run: |
          TOPA_WU_OUTPUT=topa_wu_bulk_replay python longevity-survivor/tools/replay_wu_tac_bulk.py 2>&1 | tee topa_wu_bulk.log
      - name: Upload small raw-count replay and provenance receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topa-wu-tac-bulk-counts-and-FPKM-replay
          path: |
            topa_wu_bulk_replay/
            topa_wu_bulk.log
          retention-days: 14
          if-no-files-found: warn
